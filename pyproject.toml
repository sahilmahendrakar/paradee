[project]
name = "paradee"
version = "1.0.0"
description = "An 8M-parameter English text-to-speech model distilled from Kokoro-82M"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Sahil Mahendrakar" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "onnxruntime>=1.17",
    "huggingface-hub>=0.23",
    # misaki[en] without spacy-curated-transformers, which pulls in PyTorch and is only needed for misaki's transformer mode
    "misaki>=0.9.4",
    "spacy>=3.7",
    "num2words",
    "phonemizer-fork",
    "espeakng-loader",
]

[project.scripts]
paradee = "paradee.__main__:main"

[project.urls]
"Model" = "https://huggingface.co/sahilmahendrakar/Paradee-8M-v1.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paradee"]
